<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>宠物动画预览</title>
<style>
:root{color-scheme:light;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;color:#72583e;background:#f5eada;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;padding:35px 30px 25px}main{max-width:1400px;margin:auto}
header{display:flex;align-items:end;justify-content:space-between;gap:20px;padding-bottom:22px;border-bottom:2px solid #dec49e}
h1{font-size:29px;font-weight:600;letter-spacing:1px;margin:0 0 9px}p{margin:0;color:#9b8265;font-size:14px;line-height:1.9}
.count{font-size:13px;white-space:nowrap;padding:9px 13px;border:1px solid #d3b48a;background:#fff6e5;border-radius:6px}
.toolbar{margin:23px 0;display:flex;align-items:center;gap:13px;flex-wrap:wrap}button,select{font:inherit;font-size:14px;color:#77593d;border:1px solid #bf9b6f;border-radius:6px;background:linear-gradient(#fff7e7,#eddbb9);padding:10px 16px;cursor:pointer;box-shadow:0 2px 0 #c3a47944}

.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px}.pet-card{border:2px solid #caa579;border-radius:10px;background:#fff9ee;overflow:hidden;box-shadow:0 6px 15px #96745516}
.pet-card h2{display:flex;align-items:center;justify-content:space-between;margin:0;padding:16px 16px 12px;font-size:19px;font-weight:600}.pet-card h2 span{font-size:11px;font-weight:400;color:#a88c6b}
.stage{position:relative;aspect-ratio:12/11;overflow:hidden;background:linear-gradient(#fff9ec 0 75%,#f0ddbb 75%);margin:0 8px;border-radius:5px}.stage:before{content:"";position:absolute;bottom:9%;left:29%;width:42%;height:5%;border-radius:50%;background:#c8b68d30}.stage.water{background:linear-gradient(#e7f2ed,#b9dfe3)}.stage.water:before{inset:24% 8% auto;width:84%;height:2px;background:#f0fbf5;box-shadow:18px 53px #e2f2ee,-9px 102px #daeeee}

.note{margin-top:24px;padding:18px 20px;border-left:3px solid #b5c39d;background:#fff8ea8c;font-size:13px;color:#8e775d;line-height:1.9}.note strong{font-weight:500;color:#6c7854}.bottom{font-size:12px;color:#a58e72;margin-top:20px;display:flex;gap:22px;flex-wrap:wrap}

</style>
</head>
<body><main>
<header><div><h1>宠物动画预览</h1><p>沿用现有形象，让每一只宠物自然地动起来。</p></div><div class="count">五只宠物 · 六十帧动作</div></header>
<section class="toolbar" aria-label="动画播放设置">
<button id="play" type="button">暂停播放</button>
<select id="action" aria-label="选择动作"><option value="motion">移动动作</option><option value="idle">待机动作</option></select>
<button id="direction" type="button" aria-pressed="false">方向：向右</button>
<button id="wander" type="button" aria-pressed="false">小范围移动</button>
<label class="control">播放速度 <input id="speed" type="range" min="0.5" max="1.5" step="0.25" value="1"><output id="speed-output">1 倍</output></label>
</section>
<section class="cards" id="cards" aria-label="五只宠物动画"></section>
<div class="note"><strong>待机</strong>包含眨眼与轻微呼吸；<strong>移动</strong>分别为猫狗鸡行走、兔子轻跳、鲨鱼摆尾游动。可切换方向，检查循环动作与转身效果。</div>
<footer class="bottom"><span>透明 PNG 图集与逐帧文件已另存。</span><a href="previews/petcast-animation-overview.gif">查看五宠循环动图</a><a href="README.md">素材说明</a></footer>
</main>
